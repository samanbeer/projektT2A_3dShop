    <main class="page" id="page-reviews">
        <div class="reviews-wrapper">
            <div class="page-intro">
                <h2 class="section-title">Napište nám recenzi!</h2>
                <p>Podělte se o své zkušenosti s našimi produkty a službami.</p>
            </div>

            <div class="reviews-layout">
                <div class="review-form-container glass-effect">
                    <h3>Přidat recenzi</h3>
                    <form id="review-form" onsubmit="return false;">
                        <div class="form-group">
                            <label for="review-name">Jméno</label>
                            <input type="text" id="review-name" placeholder="Vaše jméno..." required>
                        </div>
                        <div class="form-group">
                            <label for="review-stars">Hodnocení (1-5 🍺)</label>
                            <select id="review-stars" required>
                                <option value="5">🍺🍺🍺🍺🍺 (Vynikající)</option>
                                <option value="4">🍺🍺🍺🍺 (Velmi dobré)</option>
                                <option value="3">🍺🍺🍺 (Dobré)</option>
                                <option value="2">🍺🍺 (Ujde to)</option>
                                <option value="1">🍺 (Špatné)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="review-text">Recenze</label>
                            <textarea id="review-text" rows="5" placeholder="Napište pár slov..." required></textarea>
                        </div>
                        <div class="form-group">
                            <label for="review-photo">Přidat fotku (volitelné)</label>
                            <input type="file" id="review-photo" accept="image/*">
                        </div>
                        <button type="submit" id="submit-review" class="btn-main">Odeslat recenzi</button>
                    </form>
                </div>

                <div class="reviews-list-container">
                    <h3>Co o nás říkají ostatní</h3>
                    <div id="reviews-list" class="glass-effect">
                        <!-- Recenze z Firebase se načtou sem -->
                        <div class="loading">Načítání recenzí...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Image Lightbox Modal -->
    <div class="lightbox-overlay" id="image-lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" onclick="closeLightbox()" aria-label="Zavřít">×</button>
        <img src="" alt="Zvětšený obrázek" class="lightbox-image" id="lightbox-image" onclick="event.stopPropagation()">
    </div>

    <!-- Reply Modal -->
    <div class="reply-modal-overlay" id="reply-modal" onclick="closeReplyModal()">
        <div class="reply-modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeReplyModal()" aria-label="Zavřít">×</button>
            <h3>Napsat odpověď</h3>
            <form id="reply-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="reply-name">Jméno</label>
                    <input type="text" id="reply-name" placeholder="Vaše jméno..." required>
                </div>
                <div class="form-group">
                    <label for="reply-text">Odpověď</label>
                    <textarea id="reply-text" rows="4" placeholder="Napište odpověď..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="reply-photo">Přidat fotku (volitelné)</label>
                    <input type="file" id="reply-photo" accept="image/*">
                </div>
                <button type="submit" id="submit-reply" class="btn-main">Odeslat odpověď</button>
            </form>
        </div>
    </div>

    <footer class="footer" role="contentinfo">
        <div class="footer-grid">
            <div class="foot-col">© 2025 BEER 3D. Všechna práva vyhrazena.</div>
        </div>
    </footer>

    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyD0IcMlE-qMKZhqI3eiCNEOqiPAsgwUt08",
            authDomain: "beer-3d-eshop.firebaseapp.com",
            projectId: "beer-3d-eshop",
            storageBucket: "beer-3d-eshop.firebasestorage.app",
            messagingSenderId: "134665446846",
            appId: "1:134665446846:web:f53b7082d77fee0f10c5ef",
            measurementId: "G-W4GGQYQ2EX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // --- DOM Elements ---
        const reviewForm = document.getElementById('review-form');
        const submitButton = document.getElementById('submit-review');
        const reviewsList = document.getElementById('reviews-list');
        const reviewName = document.getElementById('review-name');
        const reviewText = document.getElementById('review-text');
        const reviewStars = document.getElementById('review-stars');
        const reviewPhoto = document.getElementById('review-photo');

        // --- Functions ---

        /**
         * Loads reviews from Firestore and displays them on the page.
         */
        async function loadReviews() {
            reviewsList.innerHTML = '<div class="loading">Načítání recenzí...</div>';
            try {
                const q = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    reviewsList.innerHTML = '<p class="no-reviews">Zatím tu nejsou žádné recenze. Buďte první!</p>';
                    return;
                }

                let reviewsHTML = '';
                querySnapshot.forEach((doc) => {
                    const review = doc.data();
                    const ratingBeer = '🍺'.repeat(review.stars);
                    const reviewDate = review.timestamp ? review.timestamp.toDate().toLocaleDateString('cs-CZ') : '';

                    reviewsHTML += `
                        <div class="review-item" data-review-id="${doc.id}">
                            <div class="review-header">
                                <span class="review-name">${review.name}</span>
                                <span class="review-rating" title="${review.stars}/5">${ratingBeer}</span>
                            </div>
                            <p class="review-text">${review.text}</p>
                            ${review.photoUrl ? `<img src="${review.photoUrl}" alt="Fotka k recenzi" class="review-photo" onclick="openLightbox('${review.photoUrl}')">` : ''}
                            <div class="review-footer">
                                <div class="review-date">${reviewDate}</div>
                                <button class="reply-btn" onclick="openReplyModal('${doc.id}')">💬 Odpovědět</button>
                            </div>
                            <div class="replies-container" id="replies-${doc.id}"></div>
                        </div>
                    `;
                });
                reviewsList.innerHTML = reviewsHTML;

                // Load replies for all reviews
                await loadAllReplies();
            } catch (error) {
                console.error("Error loading reviews: ", error);
                reviewsList.innerHTML = '<p class="error-message">Chyba při načítání recenzí.</p>';
            }
        }

        /**
         * Loads all replies for all reviews
         */
        async function loadAllReplies() {
            try {
                const reviewItems = document.querySelectorAll('.review-item');
                for (const reviewItem of reviewItems) {
                    const reviewId = reviewItem.getAttribute('data-review-id');
                    await loadRepliesForReview(reviewId);
                }
            } catch (error) {
                console.error("Error loading replies: ", error);
            }
        }

        /**
         * Loads replies for a specific review
         */
        async function loadRepliesForReview(reviewId) {
            try {
                const repliesContainer = document.getElementById(`replies-${reviewId}`);
                if (!repliesContainer) return;

                const q = query(
                    collection(db, "reviews", reviewId, "replies"),
                    orderBy("timestamp", "asc")
                );
                const querySnapshot = await getDocs(q);

                const replyCount = querySnapshot.size;

                // If there are no replies, don't show anything
                if (replyCount === 0) {
                    repliesContainer.innerHTML = '';
                    return;
                }

                // Create toggle button with count
                let repliesHTML = `
                    <button class="replies-toggle" onclick="toggleReplies('${reviewId}')" id="toggle-${reviewId}">
                        <span class="toggle-arrow">▼</span> Odpovědi (${replyCount})
                    </button>
                    <div class="replies-list" id="replies-list-${reviewId}" style="display: none;">
                `;

                querySnapshot.forEach((doc) => {
                    const reply = doc.data();
                    const replyDate = reply.timestamp ? reply.timestamp.toDate().toLocaleDateString('cs-CZ') : '';

                    repliesHTML += `
                        <div class="reply-item">
                            <div class="reply-header">
                                <span class="reply-name">↳ ${reply.name}</span>
                            </div>
                            <p class="reply-text">${reply.text}</p>
                            ${reply.photoUrl ? `<img src="${reply.photoUrl}" alt="Fotka k odpovědi" class="reply-photo" onclick="openLightbox('${reply.photoUrl}')">` : ''}
                            <div class="reply-date">${replyDate}</div>
                        </div>
                    `;
                });

                repliesHTML += `</div>`;
                repliesContainer.innerHTML = repliesHTML;
            } catch (error) {
                console.error(`Error loading replies for review ${reviewId}: `, error);
            }
        }

        // Form submit handlers
        async function handleFormSubmit(e) {
            e.preventDefault();
            console.log("Začínám odesílat...");

            submitButton.disabled = true;
            submitButton.textContent = 'Odesílám...';

            try {
                let photoUrl = null;
                const file = reviewPhoto.files[0];

                if (file) {
                    console.log("Nahrávám fotku...");
                    const storageRef = ref(storage, 'review-photos/' + Date.now() + '-' + file.name);
                    const snapshot = await uploadBytes(storageRef, file);
                    photoUrl = await getDownloadURL(snapshot.ref);
                    console.log("Fotka nahrána, URL:", photoUrl);
                }

                console.log("Zapisuji do databáze...");

                await addDoc(collection(db, "reviews"), {
                    name: reviewName.value,
                    text: reviewText.value,
                    stars: Number(reviewStars.value),
                    photoUrl: photoUrl,
                    timestamp: new Date(),
                    turnstileVerified: true
                });

                console.log("Zápis úspěšný!");
                reviewForm.reset();
                alert("Recenze úspěšně odeslána! 🍺");
                await loadReviews();

            } catch (error) {
                console.error("CHYBA PŘI ODESÍLÁNÍ:", error);
                alert('Chyba: ' + error.message);
            } finally {
                submitButton.disabled = false;
                if (submitButton.textContent === 'Odesílám...') {
                    submitButton.textContent = 'Odeslat recenzi';
                }
            }
        }

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', loadReviews);
        reviewForm.addEventListener('submit', handleFormSubmit);

        // --- Reply Form Handling ---
        const replyForm = document.getElementById('reply-form');
        const submitReplyButton = document.getElementById('submit-reply');
        const replyName = document.getElementById('reply-name');
        const replyText = document.getElementById('reply-text');
        const replyPhoto = document.getElementById('reply-photo');

        /**
         * Handles the reply form submission.
         */
        async function handleReplySubmit(e) {
            e.preventDefault();

            if (!currentReviewId) {
                alert('Chyba: Nebyla vybrána recenze.');
                return;
            }

            console.log("Začínám odesílat odpověď...");

            submitReplyButton.disabled = true;
            submitReplyButton.textContent = 'Odesílám...';

            try {
                let photoUrl = null;
                const file = replyPhoto.files[0];

                if (file) {
                    console.log("Nahrávám fotku odpovědi...");
                    const storageRef = ref(storage, 'reply-photos/' + Date.now() + '-' + file.name);
                    const snapshot = await uploadBytes(storageRef, file);
                    photoUrl = await getDownloadURL(snapshot.ref);
                    console.log("Fotka nahrána, URL:", photoUrl);
                }

                console.log("Zapisuji odpověď do databáze...");

                await addDoc(collection(db, "reviews", currentReviewId, "replies"), {
                    name: replyName.value,
                    text: replyText.value,
                    photoUrl: photoUrl,
                    timestamp: new Date(),
                    turnstileVerified: true
                });

                console.log("Odpověď úspěšně uložena!");
                replyForm.reset();
                alert("Odpověď úspěšně odeslána! 🍺");

                closeReplyModal();
                await loadRepliesForReview(currentReviewId);

            } catch (error) {
                console.error("CHYBA PŘI ODESÍLÁNÍ ODPOVĚDI:", error);
                alert('Chyba: ' + error.message);
            } finally {
                submitReplyButton.disabled = false;
                if (submitReplyButton.textContent === 'Odesílám...') {
                    submitReplyButton.textContent = 'Odeslat odpověď';
                }
            }
        }

        // Attach reply form submit handler
        replyForm.addEventListener('submit', handleReplySubmit);

        // --- Reply Modal Control Functions ---
        let currentReviewId = null;

        window.openReplyModal = function (reviewId) {
            currentReviewId = reviewId;
            const modal = document.getElementById('reply-modal');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';

            document.getElementById('reply-form').reset();
            submitReplyButton.disabled = false;
        }

        window.toggleReplies = function (reviewId) {
            const repliesList = document.getElementById(`replies-list-${reviewId}`);
            const toggleButton = document.getElementById(`toggle-${reviewId}`);
            const arrow = toggleButton.querySelector('.toggle-arrow');

            if (repliesList.style.display === 'none') {
                repliesList.style.display = 'block';
                arrow.style.transform = 'rotate(180deg)';
            } else {
                repliesList.style.display = 'none';
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        window.closeReplyModal = function () {
            const modal = document.getElementById('reply-modal');
            modal.classList.remove('active');
            document.body.style.overflow = '';
            currentReviewId = null;
        }

    </script>

    <script>
        // Lightbox functionality for review images
        function openLightbox(imageUrl) {
            const lightbox = document.getElementById('image-lightbox');
            const lightboxImage = document.getElementById('lightbox-image');

            lightboxImage.src = imageUrl;
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }

        function closeLightbox() {
            const lightbox = document.getElementById('image-lightbox');
            lightbox.classList.remove('active');
            document.body.style.overflow = ''; // Restore scrolling
        }

        // Close modals on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
                if (window.closeReplyModal) {
                    window.closeReplyModal();
                }
            }
        });
    </script>
</body>
